[package]
name = "host-sqlite"
version = "0.1.0"
edition = "2021"
description = "SQLite 驱动宿主：stdio NDJSON-RPC，rusqlite 只读打开本地 .db"

[[bin]]
name = "sqlite-host"
path = "src/main.rs"

[dependencies]
host-common = { path = "../host-common" }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
