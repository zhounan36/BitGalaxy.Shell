[package]
name = "host-mysql"
version = "0.1.0"
edition = "2021"
description = "MySQL 驱动宿主：stdio NDJSON-RPC，mysql_async 纯 Rust"

[[bin]]
name = "mysql-host"
path = "src/main.rs"

[dependencies]
host-common = { path = "../host-common" }
mysql_async = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
