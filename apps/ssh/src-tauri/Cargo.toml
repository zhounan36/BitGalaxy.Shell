[package]
name = "bgshell-ssh"
version = "0.1.0"
description = "BitGalaxy SSH：远程终端 / SFTP 文件管理 / 运行状态独立客户端"
edition = "2021"

[lib]
name = "bgshell_ssh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bg-core = { path = "../../../crates/bg-core" }
bg-ssh = { path = "../../../crates/bg-ssh" }
bg-server = { path = "../../../crates/bg-server" }
tauri = "2"
tauri-plugin-single-instance = "2"
# 设置弹窗「开机自启」：注册自身 exe（--silent 后台常驻）
tauri-plugin-autostart = "2"
# 终端复制/粘贴：WebView2 下 navigator.clipboard.readText 不可靠，走原生剪贴板
tauri-plugin-clipboard-manager = "2"
# 主机编辑私钥文件路径浏览 / 下载另存为
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3"
