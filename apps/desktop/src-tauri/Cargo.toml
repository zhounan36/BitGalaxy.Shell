[package]
name = "bgshell-desktop"
version = "0.3.1"
description = "BitGalaxy Shell AI 基座（Tauri 2 后台服务）：WS 7777 承载 AI/设置/主机帧 + 桌宠 + 托盘 + MCP"
edition = "2021"

[lib]
name = "bgshell_desktop_lib"
# 桌面构建只需 rlib；staticlib/cdylib 是给 tauri mobile（android/ios）用的，
# 保留会导致每次构建额外产出 1.3GB+ 的 .lib 归档和 DLL 链接，严重拖慢开发构建
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 桌宠（宠物窗 + 动作包管理）：基座的 AI 形象；无 pet 构建为纯托盘后台服务
default = ["pet"]
pet = ["dep:zip", "dep:uuid"]

[dependencies]
bg-core = { path = "../../../crates/bg-core" }
# bg-ssh：ConnRegistry（SSH 连接池）——AI 远程工具（exec_command/SFTP）与 MCP 的硬依赖
bg-ssh = { path = "../../../crates/bg-ssh" }
bg-ai = { path = "../../../crates/bg-ai" }
bg-server = { path = "../../../crates/bg-server" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
# 桌宠对话复制：WebView2 下 navigator.clipboard 不可靠，走原生剪贴板
tauri-plugin-clipboard-manager = "2"
# 桌宠动作包 zip 导入的原生文件选择器
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# 桌宠动作包：用户 DIY 动画 zip 导入（解压 + 校验落盘 pet-packs/）；仅完整版（feature = "pet"）
zip = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

# profile（dev 行号表 / release 关 LTO+strip）已上移到根 workspace Cargo.toml
