[package]
name = "bgshell-desktop"
version = "0.1.0"
description = "BitGalaxy Shell 桌面壳（Tauri 2）：主窗口工作台 + 托盘 + agent sidecar"
edition = "2021"

[lib]
name = "bgshell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
