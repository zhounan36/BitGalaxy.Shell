[package]
name = "bgshell-desktop"
version = "0.1.0"
description = "BitGalaxy Shell 桌面应用（Tauri 2 单进程）：内嵌 Agent（SSH/WS/MCP）+ 工作台 + 桌宠 + 托盘"
edition = "2021"

[lib]
name = "bgshell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# 终端复制/粘贴：WebView2 下 navigator.clipboard.readText 不可靠，走原生剪贴板
tauri-plugin-clipboard-manager = "2"
# 工作台原生文件选择器（主机编辑：私钥文件路径浏览）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "io-std", "sync", "fs"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
# 默认后端 aws-lc-rs 需要 NASM；改用 ring（纯 cc 编译，无额外系统依赖）
russh = { version = "0.59", default-features = false, features = ["ring", "flate2", "rsa"] }
# rsa 0.10.0-rc.12 与当前解析的 pkcs8 不兼容（russh 按 rc.10 开发），钉住
rsa = "=0.10.0-rc.10"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
